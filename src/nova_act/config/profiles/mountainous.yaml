# Mountainous Profile
# This profile is optimized for mountainous environments

name: "mountainous"
description: "Profile optimized for mountainous environments"
extends: "base"  # Inherits from base profile

# Analysis parameters - adjusted for mountainous conditions
analysis:
  # Mountain forecasts can be less reliable, so require more data points
  min_data_points: 5
  
  trend_detection:
    # Mountain winds can change dramatically with weather systems
    change_threshold: 25  # Less sensitive than base due to natural variability
    min_absolute_change: 3.0  # Higher than base
  
  gust_analysis:
    # Mountain areas often have gustier winds due to terrain
    gusty_threshold: 1.7  # Higher than base
    significant_gust: 7.0  # Higher than base
  
  variability:
    # Mountain winds are typically more variable
    high_variability: 15.0  # Higher than base
    low_variability: 8.0  # Higher than base

# Wind speed thresholds adjusted for mountainous conditions (in knots)
wind_speed:
  # Mountain environments often have more variable and gusty winds
  light: 
    min: 2
    max: 8  # Lower than base due to terrain sheltering
  
  moderate: 
    min: 8
    max: 18  # Lower than base
  
  strong: 
    min: 18
    max: 28  # Lower than base
  
  gale: 
    min: 28
    max: 38  # Lower than base

# Mountain-specific activity bands
activity_bands:
  paragliding:
    beginner:
      min: 3
      max: 8
      description: "Suitable for beginner paragliders in mountain conditions"
    intermediate:
      min: 8
      max: 12
      description: "Suitable for intermediate paragliders in mountain conditions"
    advanced:
      min: 12
      max: 18
      description: "Suitable for advanced paragliders in mountain conditions"
  
  hiking:
    calm:
      min: 0
      max: 10
      description: "Comfortable hiking conditions"
    moderate:
      min: 10
      max: 20
      description: "Moderate wind, exercise caution"
    strong:
      min: 20
      max: 30
      description: "Strong wind, difficult hiking conditions"

# Gust factor thresholds adjusted for mountainous terrain
gust_factor:
  steady: 
    min: 1.0
    max: 1.3  # Higher than base
  
  moderate: 
    min: 1.3
    max: 1.8  # Higher than base
  
  gusty: 
    min: 1.8
    max: 2.5  # Higher than base
  
  very_gusty: 
    min: 2.5
    max: 999  # Higher than base

# Visualization parameters
visualization:
  # Mountain visualizations benefit from showing terrain effects
  default_plots:
    - "wind_speed_time_series"
    - "wind_direction_rose"
    - "gust_factor_analysis"
    - "valley_effect_analysis"  # Added for mountain/valley wind patterns