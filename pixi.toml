[project]
authors = ["Ryan Oates <ryanoatsie@outlook.com>"]
channels = [
    "https://conda.modular.com/max-nightly",
    "https://conda.modular.com/max",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
name = "nova-act"
platforms = ["osx-arm64"]
version = "0.1.0"
description = "Nova ACT project"
readme = "README.md"

[tasks]
# Development environment
run-dev = { cmd = "python -m nova_act.main --config=configs/dev.json --debug --log-level=debug" }

# Production environment
run-prod = { cmd = "python -m nova_act.main --config=configs/prod.json --optimize" }

# Testing environment
run-test = { cmd = "python -m nova_act.main --config=configs/test.json --test-mode" }

# Build task
build = { cmd = "python -m build" }

# Utility tasks
test = { cmd = "pytest tests/" }
lint = { cmd = "ruff check . && mypy ." }
format = { cmd = "ruff format ." }

# Documentation
docs = { cmd = "mkdocs serve" }

# Installation helpers
setup = { cmd = "pip install -e '.[dev]'" }
update = { cmd = "pixi update" }

# Diagnostics
diagnose = { cmd = "python -m nova_act.diagnostics --check-all" }
fix-diagnostics = { cmd = "python -m nova_act.diagnostics --fix-all" }

# Server tasks
# Frontend server (runs on port 5173)
run-frontend = { cmd = "cd /Users/ryandavidoates/yamls && npm run dev" }
# Backend server (runs on port 8081)
run-backend = { cmd = "python start_server.py" }
# Clear backend cache and restart server
clear-cache = { cmd = "pkill -f 'python start_server.py' || true && python -c 'import shutil; import pathlib; [shutil.rmtree(p) for p in pathlib.Path(\".\").rglob(\"__pycache__\")]; shutil.rmtree(\"src/nova_act/artifacts\", ignore_errors=True); print(\"Cache cleared successfully!\")'" }
restart-server = { cmd = "pixi run clear-cache && pixi run run-backend" }
# Note: Run these commands in separate terminal windows:
# Terminal 1: pixi run run-frontend
# Terminal 2: pixi run run-backend

# Example commands
example-basic = { cmd = "python example_nova_act.py" }
example-coffee = { cmd = "python -m nova_act.samples.order_a_coffee_maker" }
example-coffee-record = { cmd = "python -m nova_act.samples.order_a_coffee_maker --record_video" }
example-apartments = { cmd = "python -m nova_act.samples.apartments_caltrain" }
example-setup-chrome = { cmd = "python -m nova_act.samples.setup_chrome_user_data_dir --user_data_dir ./chrome_profile" }
example-order-salad = { cmd = "python -m nova_act.samples.order_salad --user_data_dir ./chrome_profile" }

[dependencies]
python = ">=3.12.9,<3.13"
pip = ">=25.0.1,<26"
max = ">=25.3.0.dev2025040820,<26"
pandas = ">=2.2.3,<3"
numpy = ">=1.26.4,<2"
types-setuptools = ">=78.1.0.20250329,<79"
fastapi = ">=0.114.2,<0.115"
openai = ">=1.71.0,<2"
anthropic = ">=0.49.0,<0.50"
python-dotenv = ">=1.1.0,<2"
poetry = ">=2.1.2,<3"
retry = ">=0.9.2,<0.10"
iniconfig = ">=2.0.0,<3"
pytest = ">=8.3.5,<9"
aiohttp = ">=3.11.16,<4"

[pypi-dependencies]
build = "*"
pytest = "*"
ruff = ">=0.11.4, <0.12"
mypy = ">=1.15.0, <2"
mkdocs = ">=1.6.1, <2"
mkdocs-material = ">=9.6.11, <10"
websockets = ">=15.0.1, <16"
playwright = ">=1.51.0, <2"
