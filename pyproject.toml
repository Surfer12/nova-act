[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-act"
version = "0.1.0"
description = "NovaAct Python Package"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=nova_act --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["nova_act"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]