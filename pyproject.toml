[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-act"
version = "0.1.0"
description = "NovaAct Python Package"
requires-python = ">=3.8"
dependencies = []
authors = [
    {name = "Amazon"}
]

[tool.hatch.build]
include = [
    "src/nova_act/**/*.py",
]
packages = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/nova_act"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio"
]